Configuration:
  status: warn
  name: YAMLConfig
  appenders:
    Console:
      name: STDOUT
      target: SYSTEM_OUT
      PatternLayout:
        Pattern: "%d{DEFAULT} %p %c{2} %m%n"
        # Use below pattern for debugging (slow because gets caller location)
        # Pattern: "%d{DEFAULT} %p %c{2} %l %m%n"
  Loggers:
    logger:
      - name: org.batfish.common.BatfishLogger
        level: "OFF"
        additivity: false
      - name: org.batfish
        level: "OFF"
        additivity: false
      - name: net.sf.javabdd
        level: "OFF"
        additivity: false
      - name: smoothie
        level: "OFF"
        additivity: false
        AppenderRef:
          ref: STDOUT
    Root:
      level: "OFF"
